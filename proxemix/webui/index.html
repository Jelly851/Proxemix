<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proxemix demo</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Proxemix — demo UI</h1>
  <div class="layout">
    <div class="player-col">
      <div class="player-wrap" id="player-wrap">
        <video id="video" controls></video>
        <canvas id="overlay"></canvas>
      </div>
      <div id="bundle-meta" class="meta-line"></div>
    </div>
    <div class="side-col">
      <div class="tabs">
        <button class="tab-btn active" data-tab="events">Events</button>
        <button class="tab-btn" data-tab="report">Report</button>
        <button class="tab-btn" data-tab="search">Search</button>
        <button class="tab-btn" data-tab="chat">Chat</button>
      </div>

      <div class="tab-panel hidden" id="tab-search">
        <form id="search-form">
          <input id="search-input" type="text" placeholder="anything — backpack, stroller, bicycle" autocomplete="off">
          <button type="submit">Find</button>
        </form>
        <div id="search-status" class="meta-line"></div>
        <ul id="search-list" class="item-list"></ul>
        <div id="search-coverage" class="coverage"></div>
        <div id="search-history" class="meta-line"></div>
      </div>

      <div class="tab-panel" id="tab-events">
        <ul id="event-list" class="item-list"></ul>
      </div>

      <div class="tab-panel hidden" id="tab-report">
        <div id="report-body"></div>
      </div>

      <div class="tab-panel hidden" id="tab-chat">
        <div id="chat-log"></div>
        <form id="chat-form">
          <input id="chat-input" type="text" placeholder="e.g. busiest zone?" autocomplete="off">
          <button type="submit">Ask</button>
        </form>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
